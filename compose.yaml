services:
  tictac_duel_backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tictac_duel_backend
    restart: unless-stopped

    ports:
      - "${PORT:-3000}:3000"

    env_file:
      - .env.docker.web

    depends_on:
      tictac_duel_db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - tictac_duel_network

  tictac_duel_db:
    image: postgres:18.6-alpine

    container_name: tictac_duel_db
    restart: unless-stopped

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    env_file:
      - .env.docker.db

    volumes:
      - tictac_duel_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - tictac_duel_network

volumes:
  tictac_duel_postgres_data:

networks:
  tictac_duel_network:
    driver: bridge